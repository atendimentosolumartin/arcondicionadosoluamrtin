<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solicitar Contato | Solumartin</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#0a3d62,#0f5fa3);
padding:25px;
}

.box{
max-width:700px;
margin:auto;
background:white;
border-radius:18px;
padding:40px;
box-shadow:0 10px 30px rgba(0,0,0,0.18);
text-align:center;
}

.logo{
max-width:240px;
margin-bottom:20px;
}

h1{
color:#0a3d62;
font-size:34px;
margin-bottom:15px;
}

p{
color:#444;
font-size:18px;
margin-bottom:30px;
line-height:1.5;
}

input, select{
width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #d1d5db;
border-radius:10px;
font-size:16px;
}

.btn{
width:100%;
padding:18px;
border:none;
border-radius:12px;
font-size:20px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
display:block;
margin-bottom:15px;
}

.whats{
background:#25d366;
color:white;
}

.insta{
background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);
color:white;
}

.back{
background:#0a3d62;
color:white;
}

.info{
margin-top:20px;
font-size:15px;
color:#555;
line-height:1.7;
}

@media(max-width:600px){

.box{
padding:25px;
}

h1{
font-size:28px;
}

}
</style>
</head>

<body>

<div class="box">

<img src="../logo.png" class="logo">

<h1>Solicite seu Atendimento</h1>

<p>
Preencha abaixo e fale rapidamente com nossa equipe especializada.
</p>

<input type="text" id="nome" placeholder="Seu nome">

<input type="text" id="telefone" placeholder="Seu telefone">

<select id="servico">
<option>Instalação</option>
<option>Higienização</option>
<option>Manutenção</option>
<option>PMOC</option>
<option>Orçamento</option>
</select>

<button class="btn whats" onclick="enviarWhatsapp()">
Enviar no WhatsApp
</button>

<a class="btn insta" href="https://www.instagram.com/arcondicionado_solumartin/" target="_blank">
Falar pelo Instagram
</a>

<a class="btn back" href="../index.html">
Voltar ao Site
</a>

<div class="info">
📍 Caxias do Sul e Região<br>
📞 (54) 99167-4077<br>
📧 atendimento.solumartin@gmail.com
</div>

</div>

<script>
function enviarWhatsapp(){

let nome = document.getElementById("nome").value;
let telefone = document.getElementById("telefone").value;
let servico = document.getElementById("servico").value;

let msg = `Olá, meu nome é ${nome}. Telefone: ${telefone}. Tenho interesse em ${servico}.`;

let url = "https://wa.me/5554991674077?text=" + encodeURIComponent(msg);

window.open(url, "_blank");

}
</script>

</body>
</html>
