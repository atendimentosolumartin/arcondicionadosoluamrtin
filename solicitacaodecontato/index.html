<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitação de Contato</title>

<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#f8fafc;
text-align:center;
padding:40px;
}

.box{
max-width:600px;
margin:auto;
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

h1{
color:#0a3d62;
margin-bottom:10px;
}

p{
margin-bottom:30px;
color:#444;
}

.buttons{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.btn{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
padding:14px 24px;
border-radius:12px;
text-decoration:none;
font-weight:bold;
color:white;
min-width:220px;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
}

.whatsapp{
background:#25d366;
}

.instagram{
background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);
}

.btn img{
width:26px;
height:26px;
}
</style>
</head>

<body>

<div class="box">

<h1>Solicitação de Contato</h1>

<p>Fale agora com nossa equipe especializada.</p>

<div class="buttons">

<a class="btn whatsapp" href="https://wa.me/5554991674077" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
WhatsApp
</a>

<a class="btn instagram" href="https://www.instagram.com/arcondicionado_solumartin/" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
Instagram
</a>

</div>

</div>

</body>
</html>
